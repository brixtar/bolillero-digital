<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎱 Bolillero</title>
<style>
body { font-family: Arial; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0; }
h1 { margin-bottom: 10px; background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.big { width: 260px; height: 260px; border-radius: 50%; background: linear-gradient(135deg, #ff6b6b, #ee5a5a); display: flex; align-items: center; justify-content: center; font-size: 7rem; font-weight: 900; color: #fff; border: 8px solid rgba(255,255,255,0.2); box-shadow: 0 0 60px rgba(255,107,107,0.4); margin-bottom: 15px; }
.big.empty { background: linear-gradient(135deg, #636e72, #2d3436); font-size: 3rem; color: #b2bec3; }
.controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
button { padding: 15px 30px; border: none; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
button:hover { transform: translateY(-2px); }
.draw { background: linear-gradient(135deg, #00b894, #00cec9); font-size: 1.2rem; padding: 18px 45px; }
.reset { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
.pause { background: linear-gradient(135deg, #feca57, #ff9f43); }
.last { display: flex; gap: 10px; margin-bottom: 15px; }
.last div { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; background: rgba(255,255,255,0.1); color: #888; border: 2px solid rgba(255,255,255,0.1); transition: all 0.3s; }
.last div.on { color: #fff; transform: scale(1.1); }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; max-width: 480px; }
.grid div { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ddd; transition: all 0.3s; }
.grid div.called { background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; border-color: #00cec9; box-shadow: 0 0 10px rgba(0,206,201,0.4); }
.grid div.last { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); box-shadow: 0 0 15px rgba(255,107,107,0.6); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.status { color: #feca57; margin-bottom: 10px; min-height: 20px; font-weight: bold; }
.prog { width: 100%; max-width: 400px; margin-bottom: 10px; }
.prog-bar { width: 100%; height: 16px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00b894, #00cec9); border-radius: 10px; transition: width 0.5s; }
.prog-text { text-align: center; color: #a0a0a0; font-size: 0.85rem; margin-top: 4px; }
</style>
</head>
<body>
<h1>🎱 Bolillero Digital</h1>
<div class="last" id="lastBar">
  <div id="l1">-</div><div id="l2">-</div><div id="l3">-</div><div id="l4">-</div><div id="l5">-</div>
</div>
<div class="big empty" id="bigNum">?</div>
<p class="status" id="status">Presiona "Sacar Bolilla" para comenzar</p>
<div class="prog">
  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  <p class="prog-text" id="progText">0 / 100 bolillas</p>
</div>
<div class="controls">
  <button class="draw" onclick="draw()">🎲 Sacar Bolilla</button>
  <button class="pause" onclick="togglePause()">⏸️ Pausar</button>
  <button class="reset" onclick="reset()">🔄 Reiniciar</button>
</div>
<div class="grid" id="grid"></div>

<script>
var numbers = [], called = [], lastFive = [], isPaused = false, isDrawing = false;

function init() {
  numbers = [];
  for (var i = 0; i < 100; i++) numbers.push(i);
  createGrid();
  updateDisplay();
}

function createGrid() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  for (var i = 0; i < 100; i++) {
    var d = document.createElement('div');
    d.id = 'c' + i;
    d.textContent = String(i).padStart(2, '0');
    g.appendChild(d);
  }
}

function draw() {
  if (isPaused || isDrawing || called.length >= 100) {
    if (called.length >= 100) document.getElementById('status').textContent = '¡Todas las bolillas salieron!';
    return;
  }
  isDrawing = true;
  var big = document.getElementById('bigNum');
  big.classList.remove('empty');
  big.classList.add('shake');
  document.getElementById('status').textContent = '🎲 Revolviendo...';

  var cnt = 0;
  var interval = setInterval(function() {
    big.textContent = String(Math.floor(Math.random() * 100)).padStart(2, '0');
    cnt++;
    if (cnt > 12) {
      clearInterval(interval);
      finalize();
    }
  }, 70);
}

function finalize() {
  var avail = [];
  for (var i = 0; i < 100; i++) {
    if (called.indexOf(i) === -1) avail.push(i);
  }
  if (avail.length === 0) { isDrawing = false; return; }
  var drawn = avail[Math.floor(Math.random() * avail.length)];
  called.push(drawn);
  lastFive.unshift(drawn);
  if (lastFive.length > 5) lastFive.pop();

  var big = document.getElementById('bigNum');
  big.classList.remove('shake');
  big.textContent = String(drawn).padStart(2, '0');

  updateDisplay();
  document.getElementById('status').textContent = '¡Bolilla ' + String(drawn).padStart(2, '0') + ' salió!';
  isDrawing = false;
}

function updateDisplay() {
  // grid
  var all = document.querySelectorAll('.grid div');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.remove('called', 'last');
  }
  for (var i = 0; i < called.length; i++) {
    var el = document.getElementById('c' + called[i]);
    if (el) {
      el.classList.add('called');
      if (i === called.length - 1) el.classList.add('last');
    }
  }
  // last five
  for (var i = 1; i <= 5; i++) {
    var el = document.getElementById('l' + i);
    if (i <= lastFive.length) {
      el.textContent = String(lastFive[i - 1]).padStart(2, '0');
      el.classList.add('on');
    } else {
      el.textContent = '-';
      el.classList.remove('on');
    }
  }
  // progress
  var pct = (called.length / 100) * 100;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = called.length + ' / 100 bolillas';
}

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('status').textContent = isPaused ? '⏸️ Juego pausado' : '▶️ Juego reanudado';
}

function reset() {
  if (!confirm('¿Reiniciar?')) return;
  called = [];
  lastFive = [];
  isPaused = false;
  isDrawing = false;
  document.getElementById('bigNum').textContent = '?';
  document.getElementById('bigNum').classList.add('empty');
  document.getElementById('status').textContent = 'Presiona "Sacar Bolilla" para comenzar';
  updateDisplay();
}

// keyboard
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' && !isDrawing && !isPaused && called.length < 100) {
    e.preventDefault();
    draw();
  }
});

init();
</script>
</body>
</html>

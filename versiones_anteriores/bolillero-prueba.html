<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba Bolillero</title>
<style>
body { font-family: Arial; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 30px; }
.big { width: 200px; height: 200px; border-radius: 50%; background: #ff6b6b; display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: bold; margin: 20px; }
button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 20px; border: none; background: #00b894; color: #fff; font-weight: bold; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 20px; }
.grid div { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; background: #333; border-radius: 5px; font-size: 0.8rem; }
.grid div.called { background: #00b894; }
</style>
</head>
<body>
<h1>🎱 Prueba Bolillero</h1>
<div class="big" id="num">?</div>
<button onclick="sacar()">SACAR BOLILLA</button>
<div class="grid" id="grid"></div>

<script>
var called = [];

// Crear grid
var g = document.getElementById('grid');
for (var i = 0; i < 100; i++) {
  var d = document.createElement('div');
  d.id = 'c' + i;
  d.textContent = String(i).padStart(2, '0');
  g.appendChild(d);
}

function sacar() {
  var avail = [];
  for (var i = 0; i < 100; i++) {
    if (called.indexOf(i) === -1) avail.push(i);
  }
  if (avail.length === 0) { alert('¡Todas salieron!'); return; }
  var n = avail[Math.floor(Math.random() * avail.length)];
  called.push(n);
  document.getElementById('num').textContent = String(n).padStart(2, '0');
  document.getElementById('c' + n).classList.add('called');
}
</script>
</body>
</html>
